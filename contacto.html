  <!-- Sección de contacto -->
  <section id="contacto">
    <h2>Reservá tu aventura</h2>

    <form action="https://formsubmit.co/santiago.lamanna@hotmail.com.ar" method="POST">
      <input type="text" name="nombre" placeholder="Nombre" required>
      <input type="email" name="email" placeholder="Email" required>
      <textarea name="mensaje" placeholder="¿Qué experiencia te interesa?" required></textarea>

      <button type="submit">Enviar consulta</button>

      <input type="hidden" name="_next" value="gracias.html">
      <input type="hidden" name="_captcha" value="false">
    </form>
  </section>
